version: "3"

services:
  mysql8:
    image: mysql
    restart: always
    command: '--default-authentication-plugin=mysql_native_password --log-bin --innodb_buffer_pool_size=1G --innodb_read_io_threads=64 --innodb_write_io_threads=64 --innodb_io_capacity=5000 --innodb_thread_concurrency=0 --innodb-adaptive-hash-index=ON'
    environment:
      - MYSQL_DATABASE=db
      - MYSQL_USER=mysql
      - MYSQL_PASSWORD=mysql
      - MYSQL_ROOT_PASSWORD=mysql
    cap_add:
      - SYS_NICE
    volumes:
      - mysql8:/var/lib/mysql
    ports:
      - '3307:3306'
volumes:
  mysql8: